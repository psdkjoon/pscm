name: Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: windows-latest
            target: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1

      - run: dart pub get

      - run: dart analyze

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compile pc
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            dart compile exe bin/pc.dart -o dist/pc-${{ matrix.target }}.exe
          else
            dart compile exe bin/pc.dart -o dist/pc-${{ matrix.target }}
          fi

      - name: Compile pm
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            dart compile exe bin/pm.dart -o dist/pm-${{ matrix.target }}.exe
          else
            dart compile exe bin/pm.dart -o dist/pm-${{ matrix.target }}
          fi

      - name: Build Linux installer
        if: runner.os == 'Linux'
        run: >
          dart run tool/build_installer.dart
          dist/pc-${{ matrix.target }}
          dist/pm-${{ matrix.target }}
          dist/pscm-${{ matrix.target }}-installer

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

          New-Item -ItemType Directory -Force -Path installer | Out-Null
          Copy-Item dist/pc-${{ matrix.target }}.exe installer/pc.exe
          Copy-Item dist/pm-${{ matrix.target }}.exe installer/pm.exe

          @"
          [Setup]
          AppName=pscm
          AppVersion=${{ steps.version.outputs.version }}
          DefaultDirName={autopf}\pscm
          DefaultGroupName=pscm
          OutputDir=dist
          OutputBaseFilename=pscm-${{ matrix.target }}-installer
          ArchitecturesInstallIn64BitMode=x64
          Compression=lzma
          SolidCompression=yes
          ChangesEnvironment=yes

          [Files]
          Source: "installer\pc.exe"; DestDir: "{app}"; Flags: ignoreversion
          Source: "installer\pm.exe"; DestDir: "{app}"; Flags: ignoreversion

          [Registry]
          Root: HKLM; Subkey: "SYSTEM\CurrentControlSet\Control\Session Manager\Environment"; \
            ValueType: expandsz; ValueName: "Path"; ValueData: "{olddata};{app}"; \
            Check: NeedsAddPath('{app}')

          [Code]
          const
            EnvironmentKey = 'SYSTEM\CurrentControlSet\Control\Session Manager\Environment';

          function NeedsAddPath(Param: string): boolean;
          var
            OrigPath: string;
          begin
            if not RegQueryStringValue(HKEY_LOCAL_MACHINE, EnvironmentKey, 'Path', OrigPath) then
            begin
              Result := True;
              exit;
            end;
            Result := Pos(';' + Uppercase(ExpandConstant(Param)) + ';', ';' + Uppercase(OrigPath) + ';') = 0;
          end;

          procedure CurUninstallStepChanged(CurUninstallStep: TUninstallStep);
          var
            Paths: string;
            Entry: string;
            P: Integer;
          begin
            if CurUninstallStep <> usPostUninstall then exit;
            if not RegQueryStringValue(HKEY_LOCAL_MACHINE, EnvironmentKey, 'Path', Paths) then exit;
            Entry := Uppercase(ExpandConstant('{app}'));
            Paths := ';' + Paths + ';';
            P := Pos(';' + Entry + ';', Uppercase(Paths));
            if P = 0 then exit;
            Delete(Paths, P, Length(Entry) + 1);
            if Length(Paths) > 2 then
              Paths := Copy(Paths, 2, Length(Paths) - 2)
            else
              Paths := '';
            RegWriteExpandStringValue(HKEY_LOCAL_MACHINE, EnvironmentKey, 'Path', Paths);
          end;
          "@ | Out-File -FilePath installer.iss -Encoding ascii

          iscc installer.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: pscm-${{ matrix.target }}-installer
          path: |
            dist/*-installer*

    outputs:
      version: ${{ steps.version.outputs.version }}

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check for existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ needs.build.outputs.version }}" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.existing.outputs.exists == 'false'
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - if: steps.existing.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ needs.build.outputs.version }}
          generate_release_notes: true
          files: |
            dist/**/*-installer*
